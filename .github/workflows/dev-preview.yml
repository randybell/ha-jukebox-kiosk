name: Dev preview

# Serves jukebox-card-dev.js from GitHub Pages so a dev card can sit next to the release card.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dev-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:dev

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-dev

      # deploy-pages lists artifacts immediately and sometimes sees none, even though
      # the upload of the github-pages artifact succeeded. Wait until the API lists it.
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length')
            echo "attempt ${i}: github-pages artifacts=${n}"
            if [ "${n}" -ge 1 ]; then
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo "github-pages artifact was not listed" >&2
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5
