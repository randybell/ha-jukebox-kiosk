name: Dev preview

# Serves jukebox-card-dev.js from GitHub Pages so a dev card can sit next to the release card.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dev-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:dev

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-dev

      - id: deployment
        uses: actions/deploy-pages@v5
